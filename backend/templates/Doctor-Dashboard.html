<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/assets/css/doctor-dashbaord.css">
    <script src="https://kit.fontawesome.com/4897704fad.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "{{ firebase_api_key }}",
            authDomain: "{{ firebase_project_id }}.firebaseapp.com",
            projectId: "{{ firebase_project_id }}",
            storageBucket: "{{ firebase_project_id }}.appspot.com",
        };
        firebase.initializeApp(firebaseConfig);
    </script>
    <script src="/assets/js/FirebaseService.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="/assets/js/general.js"></script>
    <script src="/assets/js/doctor-dashbaord.js?v=doctor-sync-1"></script>

</head>

<body>

    {% include "header.html" %}

    <main>
        <div class="page-title">
            <div>
                <div class="title">Doctor Dashboard</div>
                <div class="description"><i class="fa-regular fa-hand-pointer"></i>Click any row to view enter patient
                    medical record</div>
            </div>
            <div>
                <button>Today</button>
                <button class="secondary">Emergency</button>
                <button class="secondary">All in 3 months</button>
            </div>
        </div>

        <div class="container">

            <div class="card">
                <div class="title">Appointment Calendar</div>
                <div id="fullCalendar"></div>
            </div>

            <div class="card">

                <div class="control">
                    <div class="search">
                        <input type="text" placeholder="Search patient name" id="searchInput">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <div class="custom-select">
                        <select id="priorityFilter">
                            <option value="all">All Priority</option>
                            <option value="Normal">Normal</option>
                            <option value="Urgent">Urgent</option>
                            <option value="Emergency">Emergency</option>
                            <option value="Follow-up">Follow-up</option>
                        </select>
                    </div>
                    <div class="custom-select">
                        <select id="statusFilter">
                            <option value="all">All Status</option>
                            <option value="Scheduled">Scheduled</option>
                            <option value="Checked-In">Checked-In</option>
                            <option value="Vitals-Done">Vitals-Done</option>
                            <option value="In-Room">In-Room</option>
                            <option value="Completed">Completed</option>
                            <option value="No-Show">No-Show</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </div>

                <div class="table-list">
                    <table class="custom-table">
                        <thead>
                            <tr>
                                <th>Patient Name</th>
                                <th>Appointment Time</th>
                                <th>Priority</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="appBody"></tbody>
                    </table>

                    <div class="pagination">
                        <p id="pageInfo"></p>
                        <div>
                            <div class="rowsPage">
                                <span>Rows per page:</span>
                                <select id="rowsPerPageSelect" onchange="pagination.changeRowsPerPage(this.value)">
                                    <option value="3">3</option>
                                    <option value="5">5</option>
                                    <option value="10">10</option>
                                </select>
                            </div>

                            <div class="controls">
                                <button class="secondary" id="prevBtn" onclick="pagination.prev()"><i
                                        class="fa fa-chevron-left"></i></button>
                                <span>Page:</span>
                                <select id="pageSelect" onchange="pagination.goToPage(this.value)"></select>
                                <button class="secondary" id="nextBtn" onclick="pagination.next()"><i
                                        class="fa fa-chevron-right"></i></button>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="toast card" id="toast"></div>
    </main>

    {% include "footer.html" %}

</body>

</html>
