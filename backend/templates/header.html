<header>
  <div class="top-header">
    <a class="logo">
      <i class="fa-solid fa-hospital-user"></i>
      <div class="title">CSCare Clinic System</div>
    </a>
    <div class="relative">
      <div class="dropdown">
        <div class="profile">
          <span class="profile-avatar" aria-hidden="true"><i class="fa-solid fa-user"></i></span>
          <div class="identity">
            <div class="name" id="currentUserName">Loading...</div>
            <div class="roles" id="currentUserRole">Loading...</div>
          </div>
        </div>

        <div class="dropdown-content">
          <div class="dropdown-item">
            <i class="fa-regular fa-moon"></i>
            <span>Dark Theme</span>
            <div class="toggle-switch" id="darkModeToggle"></div>
          </div>
          <a class="dropdown-item logout" href="/logout">
            <i class="fa-solid fa-arrow-right-from-bracket"></i>
            <span>Logout</span>
          </a>

        </div>
      </div>


      <i id="menuBtn" class="fa-solid fa-bars" onclick="burgerMenu()"></i>
    </div>
  </div>

  <nav class="mega-menu">
    <a href="/dashboard" data-permission="canManageAppointments"><i class="fa-solid fa-gauge"></i>Dashboard</a>
    <a href="/doctor-dashboard" data-permission="canManageDoctorAppointments"><i class="fa-solid fa-stethoscope"></i>Dashboard</a>
    <a href="/patients" data-permission="canViewPatients"><i class="fa-solid fa-users"></i>Patients</a>
    <a href="/appointments" data-permission="canManageAppointments"><i class="fa-solid fa-calendar-days"></i>Appointments</a>
    <a href="/records" data-permission="canViewMedicalRecords"><i class="fa-solid fa-file-medical"></i>Medical Records</a>
    <a href="/prescriptions" data-permission="canViewPrescriptions"><i class="fa-solid fa-prescription-bottle-medical"></i>Prescriptions</a>
    <a href="/billing" data-permission="canViewBilling"><i class="fa-solid fa-money-bill-transfer"></i>Billing</a>
    <a href="/staff" data-permission="canManageUsers"><i class="fa-solid fa-user-tie"></i>Staff Management</a>
  </nav>
</header>
