[package]
name = "pms_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4"
actix-files = "0.6"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tera = "1"
uuid = { version = "1", features = ["v4", "serde"] }
dotenv = "0.15"
reqwest = { version = "0.11", features = ["json"] }
firebase-auth = "0.5.1"
urlencoding = "2"
printpdf = "0.7"
