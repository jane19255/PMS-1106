[package]
name = "pms"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
actix-files = "0.6"
tera        = "1"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
dotenv      = "0.15"
reqwest     = { version = "0.11", features = ["json"] }
firebase-auth = "0.5.1"
actix-session = "0.11.0"
